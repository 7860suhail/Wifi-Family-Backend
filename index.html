<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Device Portal</title><style>body{font-family:Arial;margin:0;background:#f4f6fa;color:#172033}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 4px 18px #0001}input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccd3df;box-sizing:border-box}button{cursor:pointer;background:#172033;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.row{grid-template-columns:1fr}}.muted{color:#667085;font-size:13px}.device{border:1px solid #e1e5eb;padding:12px;border-radius:12px;margin:10px 0}.danger{background:#b42318}</style></head><body><div class="wrap"><h1>🔐 Family Device Portal</h1><p class="muted">Account + explicit device authorization. No hidden monitoring.</p><div id="auth"><div class="row"><div class="card"><h2>Register</h2><input id="rname" placeholder="Name"><input id="remail" type="email" placeholder="Email"><input id="rpass" type="password" placeholder="Password (8+ characters)"><button onclick="registerUser()">Create account</button></div><div class="card"><h2>Login</h2><input id="lemail" type="email" placeholder="Email"><input id="lpass" type="password" placeholder="Password"><button onclick="loginUser()">Sign in</button></div></div></div><div id="app" hidden><div class="card"><b id="who"></b><button onclick="logout()">Logout</button></div><div class="card"><h2>Authorize a device</h2><input id="dname" placeholder="Device name"><label><input id="consent" type="checkbox" style="width:auto"> I own/manage this device or have explicit consent.</label><button onclick="addDevice()">Generate device token</button><pre id="newtoken" style="white-space:pre-wrap"></pre></div><div class="card"><h2>My devices</h2><div id="devices"></div></div></div><p id="msg"></p></div><script>
const $=id=>document.getElementById(id); const msg=x=>$('msg').textContent=x;
function token(){return localStorage.getItem('portalToken')||''}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'}; if(token())opt.headers.Authorization='Bearer '+token(); const r=await fetch(url,opt); const j=await r.json().catch(()=>({})); if(!r.ok)throw Error(j.error||'Request failed'); return j;}
async function registerUser(){try{const j=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:$('rname').value,email:$('remail').value,password:$('rpass').value})});localStorage.setItem('portalToken',j.token);showApp();msg('Account created.')}catch(e){msg(e.message)}}
async function loginUser(){try{const j=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('lemail').value,password:$('lpass').value})});localStorage.setItem('portalToken',j.token);showApp();msg('Signed in.')}catch(e){msg(e.message)}}
async function showApp(){if(!token())return;try{const j=await api('/api/me');$('auth').hidden=true;$('app').hidden=false;$('who').textContent=j.user.name+' — '+j.user.email;loadDevices()}catch{logout()}}
async function addDevice(){try{const j=await api('/api/devices',{method:'POST',body:JSON.stringify({deviceName:$('dname').value,consent:$('consent').checked})});$('newtoken').textContent='DEVICE TOKEN (save securely; shown once):\n'+j.deviceToken; $('dname').value='';$('consent').checked=false;loadDevices()}catch(e){msg(e.message)}}
async function loadDevices(){try{const j=await api('/api/devices');$('devices').innerHTML=j.devices.length?j.devices.map(d=>`<div class="device"><b>${esc(d.deviceName)}</b><br>Last seen: ${esc(d.lastSeen||'never')}<br><button class="danger" onclick="revoke(${d.id})">Revoke</button></div>`).join(''):'No devices yet.'}catch(e){msg(e.message)}}
async function revoke(id){if(!confirm('Revoke this device?'))return;try{await api('/api/devices/'+id+'/revoke',{method:'POST'});loadDevices()}catch(e){msg(e.message)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function logout(){localStorage.removeItem('portalToken');location.reload()}
showApp();
</script></body></html>
